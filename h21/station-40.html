<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

      content="Station 40 – NÖ Landesausstellung 2026."

    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

    <header class="site-header">
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Zum dunklen Modus wechseln"
      >

        aria-label="Gefühl auswählen und anhören"

        <button
          class="emotion-btn"
          data-audio="audio/stolz.mp3"
          aria-pressed="false"
        >
          stolz
        </button>
        <button
          class="emotion-btn"
          data-audio="audio/grantig.mp3"
          aria-pressed="false"
        >
          grantig
        </button>
        <button
          class="emotion-btn"
          data-audio="audio/aengstlich.mp3"
          aria-pressed="false"
        >

        </button>
        <button
          class="emotion-btn"
          data-audio="audio/ueberrascht.mp3"

        </button>
        <button
          class="emotion-btn"
          data-audio="audio/neidisch.mp3"
          aria-pressed="false"
        >
          neidisch
        </button>
        <button
          class="emotion-btn"
          data-audio="audio/gluecklich.mp3"
          aria-pressed="false"
        >

        </button>
        <button
          class="emotion-btn"
          data-audio="audio/zornig.mp3"

        <button

        <button
          class="emotion-btn"
          data-audio="audio/ekel.mp3"
          aria-pressed="false"

        <button
          class="emotion-btn"

        <button

          aria-pressed="false"
        >

        </button>
        <button
          class="emotion-btn"
          data-audio="audio/nervoes.mp3"
          aria-pressed="false"
        >
          nervös
        </button>
        <button
          class="emotion-btn"
          data-audio="audio/erschrocken.mp3"

        <button
          class="emotion-btn"
          data-audio="audio/wuetend.mp3"
          aria-pressed="false"
        >

      </div>

      <audio id="emotion-audio" preload="none" aria-hidden="true"></audio>
    </main>

    <script src="../assets/js/script.js"></script>

</html>
